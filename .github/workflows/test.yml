name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (macOS)
    runs-on: macos-15
    env:
      SHELL: /bin/zsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Gofmt
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 30m ./...
      - name: Race
        run: |
          go test -race -c -o "$RUNNER_TEMP/gateway.race" ./internal/gateway/
          build/race-shards.sh internal/gateway "$RUNNER_TEMP/gateway.race" "$(getconf _NPROCESSORS_ONLN)" -test.timeout=20m
          go test -race ./internal/redact/
      - name: Race account usage
        run: go test -race ./internal/provider/ -run '^Test(LoginUsage|SubscriptionUsageEachAccount)'
      - name: Build macOS app and CLI
        run: |
          make app
          make release-cli
